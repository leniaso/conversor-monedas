spring.application.name=conversor-monedas

# --- Conexion a Neon (Postgres) ---
# Usa variables de entorno para no exponer credenciales en el repo.
# Ejemplo de DB_URL: jdbc:postgresql://ep-xxxx-xxxx.us-east-2.aws.neon.tech/neondb?sslmode=require
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Pool de conexiones (Neon recomienda pools pequeños en el tier free)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# CORS: origen del frontend React (Vite)
app.cors.allowed-origins=${CORS_ORIGIN:http://localhost:5173}

# Puerto del servidor
server.port=${PORT:8080}
